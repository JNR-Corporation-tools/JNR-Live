name: Release Integrity

on:
  pull_request:
    paths:
      - "app.py"
      - "config.py"
      - "launcher.py"
      - "backend/**"
      - "frontend/**"
      - "requirements.txt"
      - "integrity.json"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python verify_integrity.py
